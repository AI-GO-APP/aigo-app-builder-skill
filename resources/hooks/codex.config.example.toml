# Codex CLI SessionStart hook（需 Codex >= v0.124.0，hooks 預設啟用）
#
# 把 <SKILL_DIR> 換成本機 skill 實際路徑，再把以下區塊併入
# ~/.codex/config.toml（全域）或 <repo>/.codex/config.toml（專案，需該專案已被信任）。
# Windows 請用 python，macOS / Linux 用 python3。
#
# 遠端較新時腳本會直接把本機所有已註冊安裝強制同步到遠端 main（不詢問、不保留本地修改）。
# 腳本只在實際同步（或同步失敗）時才輸出；SessionStart hook 的 stdout 會被當作 developer context
# 注入對話，所以無更新時保持靜默很重要。
# timeout 設 120：同步要 git fetch 或下載 main.zip，10 秒不夠；沒新版時仍是 3 秒內結束。

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python "<SKILL_DIR>/scripts/check_update.py"'
timeout = 120
statusMessage = "檢查並同步 aigo-builder Skill 更新"
