# Copy to the Hosted App repo as .github/workflows/deploy-hosted.yml.
# AI fills deploy.json from verified App details; the student sets the App-scoped secret.
name: Check and deploy Hosted App
on:
  pull_request:
    paths: ['src/**', 'app/**', 'server/**', 'public/**', 'scripts/**', 'package*.json', 'Dockerfile', '.dockerignore', 'VERSION', 'deploy.json', '.github/workflows/deploy-hosted.yml']
  push:
    branches: [main]
    paths: ['src/**', 'app/**', 'server/**', 'public/**', 'scripts/**', 'package*.json', 'Dockerfile', '.dockerignore', 'VERSION', 'deploy.json', '.github/workflows/deploy-hosted.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-${{ github.repository }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python scripts/ci_deploy_hosted.py --check
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: latest
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip old run; main has a newer commit."
          fi
      - uses: actions/setup-python@v5
        if: steps.latest.outputs.proceed == 'true'
        with:
          python-version: '3.12'
      - if: steps.latest.outputs.proceed == 'true'
        run: python -m pip install httpx==0.28.1
      - if: steps.latest.outputs.proceed == 'true'
        env:
          AIGO_DEPLOY_TOKEN: ${{ secrets.AIGO_DEPLOY_TOKEN }}
        run: python scripts/ci_deploy_hosted.py
